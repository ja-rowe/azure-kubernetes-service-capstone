# Reviewed, time-bounded security exceptions.
#
# Every entry is narrow (one finding id, explicit scope), owned, approved, justified and expiring.
# render_exceptions.py validates this file and turns the entries for one scan target into a
# Trivy ignore file; expired entries stop suppressing their finding, which then blocks again.
#
#   - id: CVE-2021-12345              # CVE / GHSA id, or Trivy misconfiguration id (AVD-...)
#     kind: vulnerability             # vulnerability | misconfiguration
#     scope: [carts]                  # scan targets: image/service names, "iac", or "*" for all
#     owner: Javel Rowe               # accountable for remediation
#     approver: Javel Rowe            # who accepted the risk
#     rationale: why the risk is accepted and how it will be remediated
#     created: 2026-10-15
#     expires: 2027-01-13             # at most policy.yaml exceptions.max_days after created

exceptions:
  # Infrastructure findings in this repository's own Terraform (reviewed individually).
  - id: AZU-0041
    kind: misconfiguration
    scope: [iac]
    owner: Javel Rowe
    approver: Javel Rowe
    rationale: AKS API server has no authorized IP ranges because the pipelines run on Microsoft-hosted agents without fixed IPs; access is Entra ID + Azure RBAC with namespace-scoped roles. Revisit with self-hosted agents or a private cluster
    created: 2026-10-15
    expires: 2027-01-13
  - id: AZU-0013
    kind: misconfiguration
    scope: [iac]
    owner: Javel Rowe
    approver: Javel Rowe
    rationale: Key Vault firewall left open (no default Deny) because the hosted infra pipeline must reach the vaults from changing IPs; access is limited by per-vault access policies (only the environment identity reads, only the infra pipeline writes). Revisit with private endpoints or self-hosted agents
    created: 2026-10-15
    expires: 2027-01-13

