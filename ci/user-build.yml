# Builds and pushes the user image(s) to ACR after user-test succeeds, for exactly the tested commit.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: aks-terraform   # provides dockerRegistryServiceConnection

resources:
  pipelines:
    - pipeline: tests
      source: user-test     # name of the test pipeline in Azure DevOps
      trigger:
        stages:
          - Test
  repositories:
    - repository: svc
      type: git          # Azure Repos Git; the repository is in the same project as this pipeline
      name: user
      ref: main

stages:
  - stage: Build
    jobs:
      - job: image
        steps:
          - template: templates/build-image.yml
            parameters:
              images:
                - repository: user
                  dockerfile: docker/user/Dockerfile-release
                  context: .
                - repository: user-db
                  dockerfile: docker/user-db/Dockerfile
                  context: docker/user-db
