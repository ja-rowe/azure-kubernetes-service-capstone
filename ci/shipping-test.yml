# Unit tests for shipping. Runs on every push to main of the shipping repository.
# On success, ci/shipping-build.yml is triggered.
trigger: none
pr: none

pool:
  vmImage: ubuntu-24.04

resources:
  repositories:
    - repository: svc
      type: git          # Azure Repos Git; the repository is in the same project as this pipeline
      name: shipping
      ref: main
      trigger:
        branches:
          include:
            - main

stages:
  - stage: Test
    jobs:
      - job: unit
        steps:
          - template: templates/test-java.yml
