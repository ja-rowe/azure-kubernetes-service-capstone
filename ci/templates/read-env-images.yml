# Reads the image set currently deployed in `sourceEnvironment` from its Terraform state, so a
# promotion applies exactly the same images. Emits output variable `images` of step `resolve`.
parameters:
  - name: sourceEnvironment
    type: string

steps:
  - task: TerraformInstaller@1
    displayName: Install Terraform
    inputs:
      terraformVersion: latest

  - script: |
      set -euo pipefail
      cd envs
      terraform init -input=false \
        -backend-config="resource_group_name=$(stateRg)" \
        -backend-config="storage_account_name=$(stateAccount)" \
        -backend-config="container_name=$(stateContainer)" \
        -backend-config="key=env-${{ parameters.sourceEnvironment }}.tfstate"

      if ! images=$(terraform output -json images 2>/dev/null) || [ "$images" = "null" ]; then
        echo "##vso[task.logissue type=error]Nothing is deployed in '${{ parameters.sourceEnvironment }}' yet; promote or deploy it first."
        exit 1
      fi
      images=$(jq -c . <<<"$images")

      echo "Promoting the images running in ${{ parameters.sourceEnvironment }}:"
      jq -r 'to_entries[] | "\(.key) -> \(.value)"' <<<"$images"
      {
        echo "Images running in **${{ parameters.sourceEnvironment }}**, promoted as-is:"
        echo
        echo "| service | image |"
        echo "|---|---|"
        jq -r 'to_entries[] | "| \(.key) | `\(.value)` |"' <<<"$images"
      } > images.md

      echo "##vso[task.setvariable variable=images;isOutput=true]$images"
      echo "##vso[task.uploadsummary]$PWD/images.md"
    name: resolve
    displayName: Read images deployed in ${{ parameters.sourceEnvironment }}
    env:
      ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
