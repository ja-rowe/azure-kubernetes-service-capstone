# Builds and pushes the catalogue image(s) to ACR after catalogue-test succeeds, for exactly the tested commit.
trigger: none
pr: none

pool:
  vmImage: ubuntu-24.04

variables:
  - group: aks-terraform   # provides dockerRegistryServiceConnection

resources:
  pipelines:
    - pipeline: tests
      source: catalogue-test     # name of the test pipeline in Azure DevOps
      trigger:
        stages:
          - Test
  repositories:
    - repository: svc
      type: git          # Azure Repos Git; the repository is in the same project as this pipeline
      name: catalogue
      ref: main

stages:
  - stage: Build
    jobs:
      - job: image
        steps:
          - template: templates/build-image.yml
            parameters:
              images:
                - repository: catalogue
                  dockerfile: docker/catalogue/Dockerfile
                  context: .
                - repository: catalogue-db
                  dockerfile: docker/catalogue-db/Dockerfile
                  context: docker/catalogue-db
