# Unit tests for front-end. Runs on every push to main of the front-end repository.
# On success, ci/front-end-build.yml is triggered.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: svc
      type: git          # Azure Repos Git; the repository is in the same project as this pipeline
      name: front-end
      ref: main
      trigger:
        branches:
          include:
            - main

stages:
  - stage: Test
    jobs:
      - job: unit
        steps:
          - template: templates/test-node.yml
