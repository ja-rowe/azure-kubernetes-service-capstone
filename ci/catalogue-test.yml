# Unit tests for catalogue. Runs on every push to main of the catalogue repository.
# On success, ci/catalogue-build.yml is triggered.
trigger: none
pr: none

pool:
  vmImage: ubuntu-24.04

resources:
  repositories:
    - repository: svc
      type: git          # Azure Repos Git; the repository is in the same project as this pipeline
      name: catalogue
      ref: main
      trigger:
        branches:
          include:
            - main

stages:
  - stage: Test
    jobs:
      - job: unit
        steps:
          - template: templates/test-go.yml
            parameters:
              service: catalogue
              command: for i in 1 2 3; do go get -u github.com/FiloSottile/gvt && gvt restore && break; sleep 5; done; go test -vet=off -v .
