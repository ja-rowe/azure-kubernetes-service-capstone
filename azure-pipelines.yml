# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  - group: 'aks-terraform'
  - name: stateRg
    value: 't3-capstone-tfstate-rg'
  - name: stateAccount
    value: 't3capstonetfstate'
  - name: stateContainer
    value: 'tfstate'
  - name: stateKey
    value: 'aks.terraform.tfstate'
  - name: TF_VAR_CARTS_IMG
    value: 'weaveworksdemos/carts:0.4.8'
  - name: TF_VAR_CATALOGUE_IMG
    value: 'weaveworksdemos/catalogue:0.3.5'
  - name: TF_VAR_CATALOGUE_DB_IMG
    value: 'weaveworksdemos/catalogue-db:0.3.0'
  - name: TF_VAR_ORDERS_IMG
    value: 'weaveworksdemos/orders:0.4.7'
  - name: TF_VAR_PAYMENT_IMG
    value: 'weaveworksdemos/payment:0.4.3'
  - name: TF_VAR_QUEUE_MASTER_IMG
    value: 'weaveworksdemos/queue-master:0.3.1'
  - name: TF_VAR_SHIPPING_IMG
    value: 'weaveworksdemos/shipping:0.4.8'
  - name: TF_VAR_USER_IMG
    value: 'weaveworksdemos/user:0.4.7'
  - name: TF_VAR_USER_DB_IMG
    value: 'weaveworksdemos/user-db:0.3.0'
  - name: TF_VAR_FRONTEND_IMG
    value: 'weaveworksdemos/front-end:0.3.12'
  - name: TF_VAR_CLIENT_ID
    value: ''
  - name: TF_VAR_CLIENT_SECRET
    value: ''

stages:
  - stage: bootstrap
    jobs:
      - job: bootstrap
        steps:
        - task: DownloadSecureFile@1
          name: envFile
          displayName: 'Download .env secure file'
          inputs:
            secureFile: '.env'

        - script: |
            set -a
            source "$(envFile.secureFilePath)"
            set +a

            # Mask the secret in ADO logs before it's used anywhere else
            echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$ARM_CLIENT_SECRET"

            # Expose the rest of the service principal to later steps (Terraform azurerm provider)
            echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$ARM_CLIENT_ID"
            echo "##vso[task.setvariable variable=ARM_TENANT_ID]$ARM_TENANT_ID"
            echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$ARM_SUBSCRIPTION_ID"

            # Pass the same service principal to Terraform
            echo "##vso[task.setvariable variable=TF_VAR_CLIENT_ID]$ARM_CLIENT_ID"
            echo "##vso[task.setvariable variable=TF_VAR_CLIENT_SECRET;issecret=true]$ARM_CLIENT_SECRET"

            az login --service-principal \
              --username "$ARM_CLIENT_ID" \
              --password "$ARM_CLIENT_SECRET" \
              --tenant "$ARM_TENANT_ID" \
              --output none

            az account set --subscription "$ARM_SUBSCRIPTION_ID"

            echo "Authenticated. Active subscription:"
            az account show --output table
          displayName: 'Authenticate to Azure and confirm access'
        - script: |
            set -ea
            source "$(envFile.secureFilePath)"
            set +a

            STATE_RG="t3-capstone-tfstate-rg"
            STATE_LOCATION="East US"
            STATE_ACCOUNT="t3capstonetfstate"
            STATE_CONTAINER="tfstate"

            az group create \
              --name "$STATE_RG" \
              --location "$STATE_LOCATION" \
              --output none

            az storage account create \
              --name "$STATE_ACCOUNT" \
              --resource-group "$STATE_RG" \
              --location "$STATE_LOCATION" \
              --sku Standard_LRS \
              --encryption-services blob \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --output none

            az storage container create \
              --name "$STATE_CONTAINER" \
              --account-name "$STATE_ACCOUNT" \
              --auth-mode login \
              --output none

            ACCOUNT_KEY=$(az storage account keys list \
              --resource-group "$STATE_RG" \
              --account-name "$STATE_ACCOUNT" \
              --query '[0].value' -o tsv)

            # Mask the storage key and expose it for the azurerm backend (reads ARM_ACCESS_KEY)
            echo "##vso[task.setvariable variable=ARM_ACCESS_KEY;issecret=true]$ACCOUNT_KEY"
          displayName: 'Provision Terraform remote state storage'

        - script: |
            set -e
            RESOURCE_GROUP_NAME="aks-terraform"
            CONTAINER_REGISTRY_NAME="sockshop1"

            az group create \
              --name "$RESOURCE_GROUP_NAME" \
              --location centralus \
              --output none

            az acr create \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --name "$CONTAINER_REGISTRY_NAME" \
              --sku Standard \
              --output none
          displayName: 'Provision resource group and Azure Container Registry'

        - script: |
            set -e
            source "$(envFile.secureFilePath)"

            ACR_ID=$(az acr show --name sockshop1 --resource-group aks-terraform --query id -o tsv)

            # Skip if the service principal already has AcrPull on the registry
            EXISTING=$(az role assignment list \
              --assignee "$ARM_CLIENT_ID" \
              --role AcrPull \
              --scope "$ACR_ID" \
              --query '[0].id' -o tsv)

            if [ -z "$EXISTING" ]; then
              az role assignment create \
                --assignee "$ARM_CLIENT_ID" \
                --assignee-principal-type ServicePrincipal \
                --role AcrPull \
                --scope "$ACR_ID" \
                --output none
              echo "AcrPull assigned."
            else
              echo "AcrPull already assigned."
            fi
          displayName: 'Assign AcrPull to the service principal'
          enabled: false

  - stage: tfvalidate
    dependsOn: bootstrap
    jobs:
      - job: validate
        continueOnError: false
        steps:
          - task: DownloadSecureFile@1
            name: envFile
            displayName: 'Download .env secure file'
            inputs:
              secureFile: '.env'

          - script: |
              set -a
              source "$(envFile.secureFilePath)"
              set +a

              # Mask the secret in ADO logs before it's used anywhere else
              echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$ARM_CLIENT_SECRET"

              # Expose the rest of the service principal to later steps (Terraform azurerm provider)
              echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$ARM_CLIENT_ID"
              echo "##vso[task.setvariable variable=ARM_TENANT_ID]$ARM_TENANT_ID"
              echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$ARM_SUBSCRIPTION_ID"

              # Pass the same service principal to Terraform
              echo "##vso[task.setvariable variable=TF_VAR_CLIENT_ID]$ARM_CLIENT_ID"
              echo "##vso[task.setvariable variable=TF_VAR_CLIENT_SECRET;issecret=true]$ARM_CLIENT_SECRET"

              az login --service-principal \
                --username "$ARM_CLIENT_ID" \
                --password "$ARM_CLIENT_SECRET" \
                --tenant "$ARM_TENANT_ID" \
                --output none

              az account set --subscription "$ARM_SUBSCRIPTION_ID"

              echo "Authenticated. Active subscription:"
              az account show --output table
            displayName: 'Authenticate to Azure and confirm access'
          - script: |
              ACCOUNT_KEY=$(az storage account keys list \
                --resource-group "$(stateRg)" \
                --account-name "$(stateAccount)" \
                --query '[0].value' -o tsv)

              # Mask the storage key and expose it for the azurerm backend (reads ARM_ACCESS_KEY)
              echo "##vso[task.setvariable variable=ARM_ACCESS_KEY;issecret=true]$ACCOUNT_KEY"
            displayName: 'Fetch Terraform remote state storage key'
          - script: 'echo "$(containerRegistry)"'
          - script: |
              declare -A repositories=(
                ["carts"]="CARTS_IMG"
                ["catalogue"]="CATALOGUE_IMG"
                ["catalogue-db"]="CATALOGUE_DB_IMG"
                ["orders"]="ORDERS_IMG"
                ["payment"]="PAYMENT_IMG"
                ["queuemaster"]="QUEUE_MASTER_IMG"
                ["shipping"]="SHIPPING_IMG"
                ["user"]="USER_IMG"
                ["user-db"]="USER_DB_IMG"
                ["frontend"]="FRONTEND_IMG"
              )

              for repo in "${!repositories[@]}"; do
                # Attempt to fetch the latest tag and suppress any error output
                latest_tag=$(az acr repository show-tags -n sockshop1 --repository $repo --orderby time_desc --output tsv 2>/dev/null | head -n 1)
                # Check if the latest_tag is empty
                if [ -z "$latest_tag" ]; then
                  echo "No tag found for repository $repo or repository does not exist."
                  continue
                fi

                # If successful and tag is found, set the variable
                img_name="$(containerRegistry)/$repo:$latest_tag"
                echo "##vso[task.setvariable variable=TF_VAR_${repositories[$repo]}]$img_name"
                echo "image name is: $img_name"
              done
              log_var=DEBUG
              echo "##vso[task.setvariable variable=TF_LOG]$log_var"
            displayName: 'Resolve latest image tags from ACR'
          - task: TerraformInstaller@1
            displayName: tfinstall
            inputs:
              terraformVersion: 'latest'
          - script: |
              terraform init -input=false \
                -backend-config="resource_group_name=$(stateRg)" \
                -backend-config="storage_account_name=$(stateAccount)" \
                -backend-config="container_name=$(stateContainer)" \
                -backend-config="key=$(stateKey)"
            displayName: init
            env:
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
              TF_VAR_CLIENT_SECRET: $(TF_VAR_CLIENT_SECRET)
          - script: terraform validate
            displayName: validate
            env:
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
              TF_VAR_CLIENT_SECRET: $(TF_VAR_CLIENT_SECRET)
  - stage: deploy
    condition: succeeded('tfvalidate')
    dependsOn: tfvalidate
    jobs:
      - job: apply
        steps:
        - task: DownloadSecureFile@1
          name: envFile
          displayName: 'Download .env secure file'
          inputs:
            secureFile: '.env'

        - script: |
            set -a
            source "$(envFile.secureFilePath)"
            set +a

            # Mask the secret in ADO logs before it's used anywhere else
            echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$ARM_CLIENT_SECRET"

            # Expose the rest of the service principal to later steps (Terraform azurerm provider)
            echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$ARM_CLIENT_ID"
            echo "##vso[task.setvariable variable=ARM_TENANT_ID]$ARM_TENANT_ID"
            echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$ARM_SUBSCRIPTION_ID"

            # Pass the same service principal to Terraform
            echo "##vso[task.setvariable variable=TF_VAR_CLIENT_ID]$ARM_CLIENT_ID"
            echo "##vso[task.setvariable variable=TF_VAR_CLIENT_SECRET;issecret=true]$ARM_CLIENT_SECRET"

            az login --service-principal \
              --username "$ARM_CLIENT_ID" \
              --password "$ARM_CLIENT_SECRET" \
              --tenant "$ARM_TENANT_ID" \
              --output none

            az account set --subscription "$ARM_SUBSCRIPTION_ID"

            echo "Authenticated. Active subscription:"
            az account show --output table
          displayName: 'Authenticate to Azure and confirm access'
        - script: |
            ACCOUNT_KEY=$(az storage account keys list \
              --resource-group "$(stateRg)" \
              --account-name "$(stateAccount)" \
              --query '[0].value' -o tsv)

            # Mask the storage key and expose it for the azurerm backend (reads ARM_ACCESS_KEY)
            echo "##vso[task.setvariable variable=ARM_ACCESS_KEY;issecret=true]$ACCOUNT_KEY"
          displayName: 'Fetch Terraform remote state storage key'
        - script: |
            declare -A repositories=(
              ["carts"]="CARTS_IMG"
              ["catalogue"]="CATALOGUE_IMG"
              ["catalogue-db"]="CATALOGUE_DB_IMG"
              ["orders"]="ORDERS_IMG"
              ["payment"]="PAYMENT_IMG"
              ["queuemaster"]="QUEUE_MASTER_IMG"
              ["shipping"]="SHIPPING_IMG"
              ["user"]="USER_IMG"
              ["user-db"]="USER_DB_IMG"
              ["frontend"]="FRONTEND_IMG"
            )

            for repo in "${!repositories[@]}"; do
              # Attempt to fetch the latest tag and suppress any error output
              latest_tag=$(az acr repository show-tags -n sockshop1 --repository $repo --orderby time_desc --output tsv 2>/dev/null | head -n 1)
              # Check if the latest_tag is empty
              if [ -z "$latest_tag" ]; then
                echo "No tag found for repository $repo or repository does not exist."
                continue
              fi

              # If successful and tag is found, set the variable
              img_name="$(containerRegistry)/$repo:$latest_tag"
              echo "##vso[task.setvariable variable=TF_VAR_${repositories[$repo]}]$img_name"
              echo "image name is: $img_name"
            done
            log_var=DEBUG
            echo "##vso[task.setvariable variable=TF_LOG]$log_var"
          displayName: 'Resolve latest image tags from ACR'
        - task: TerraformInstaller@1
          displayName: tfinstall
          inputs:
            terraformVersion: 'latest'
        - script: |
            terraform init -input=false \
              -backend-config="resource_group_name=$(stateRg)" \
              -backend-config="storage_account_name=$(stateAccount)" \
              -backend-config="container_name=$(stateContainer)" \
              -backend-config="key=$(stateKey)"
          displayName: init
          env:
            ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
            ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
            TF_VAR_CLIENT_SECRET: $(TF_VAR_CLIENT_SECRET)
        - script: terraform plan -input=false -out=tfplan
          displayName: plan
          env:
            ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
            ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
            TF_VAR_CLIENT_SECRET: $(TF_VAR_CLIENT_SECRET)
        - script: terraform apply -input=false tfplan
          displayName: apply
          env:
            ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
            ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
            TF_VAR_CLIENT_SECRET: $(TF_VAR_CLIENT_SECRET)
        - script: |
            set -ea
            source "$(envFile.secureFilePath)"
            set +a

            az aks get-credentials \
              --resource-group aks-terraform \
              --name aks-terraform \
              --overwrite-existing

            echo "Waiting for the front-end LoadBalancer to get an external IP..."
            for i in $(seq 1 30); do
              EXTERNAL_IP=$(kubectl get svc front-end -n sock-shop -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              if [ -n "$EXTERNAL_IP" ]; then
                break
              fi
              sleep 10
            done

            kubectl get svc front-end -n sock-shop
            echo "Sock Shop: http://$EXTERNAL_IP"
          displayName: 'Get Sock Shop external IP'

